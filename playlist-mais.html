<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
componentDidMount() {
const id = null;
if (!id) return;
try {
fetch('/.netlify/functions/playlist?id=' + encodeURIComponent(id), { cache: 'no-store' })
.then((r) => (r.ok ? r.json() : null))
.then((d) => { if (d && Array.isArray(d.videos) && d.videos.length) this.setState({ vids: d.videos }); })
.catch(() => {});
} catch (e) {}
}
renderVals() {
const real = (this.state && this.state.vids) || [];
const full = "https://www.youtube.com/@KingDrakone/playlists";
const videos = [];
for (let i = 0; i < 5; i++) {
const r = real[i];
videos.push({
n: i + 1,
title: r ? r.titulo : '[título do vídeo ' + (i + 1) + ']',
thumb: r ? r.miniatura : '',
url: r ? r.url : full
});
}
return { videos: videos };
}
}
</script>
